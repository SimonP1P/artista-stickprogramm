[package]
name = "artista-stickprogramm"
version = "0.1.0"
description = "Stickprogramm für die BERNINA artista 185"
authors = ["Simon Horvat"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "stickprogramm_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde_json = "1"
tauri-plugin-dialog = "2"
stick-api = { version = "0.1.0", path = "../../kern/stick-api" }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Rechenkern (stick-api, stick-vektor, Bildbibliotheken) auch im Debug-Bau optimiert übersetzen: ein Foto mit 35
# Millionen Punkten zu laden und umzuwandeln dauert sonst sehr lange. Das Programm selbst bleibt ein Debug-Bau.
[profile.dev.package."*"]
opt-level = 2
