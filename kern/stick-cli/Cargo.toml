[package]
name = "stick-cli"
description = "Kommandozeile zum Rechenkern (Design-JSON -> EXP + SVG, Puffer, Maschine)"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "stick"
path = "src/main.rs"

[dependencies]
stick-kern.workspace = true
stick-formate.workspace = true
stick-maschine = { workspace = true, default-features = false }
stick-vektor.workspace = true
stick-api.workspace = true
serde_json.workspace = true

[features]
default = ["port"]
# echter serieller Port (sonst nur --simulation)
port = ["stick-maschine/port"]
