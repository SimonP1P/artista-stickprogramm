[package]
name = "stick-vektor"
description = "Bild → Umrisse und SVG → Design (Stichart nach Breite wie EasyStitch)"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
stick-kern.workspace = true
serde_json.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif"] }
imageproc = { version = "0.27", default-features = false }
# SVG lesen (Gruppen, Transformationen, Stile, Formen → Pfade); ohne Text/Schriften
usvg = { version = "0.50", default-features = false }
