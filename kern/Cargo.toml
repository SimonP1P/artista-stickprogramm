[workspace]
resolver = "3"
members = ["stick-kern", "stick-formate", "stick-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Simon Horvat"]
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
stick-kern = { path = "stick-kern" }
stick-formate = { path = "stick-formate" }
